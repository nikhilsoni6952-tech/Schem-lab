<li class="a-{{ a.action }}"><span class="act">{{ a.get_action_display }}</span><span>{% if a.chemical %}<a href="{{ a.chemical.get_absolute_url }}">{{ a.chemical_name }}</a>{% else %}{{ a.chemical_name }}{% endif %}{% if a.detail %} <span class="muted">{{ a.detail }}</span>{% endif %}{% if a.by %} <span class="by">by {{ a.by }}</span>{% endif %}</span><time datetime="{{ a.created_at|date:'c' }}" title="{{ a.created_at|date:'j M Y, H:i' }}">{{ a.created_at|timesince }} ago</time></li>
