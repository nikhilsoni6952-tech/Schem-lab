<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong · S ChemLab</title>
<style>
  :root{color-scheme:dark light;--bg:#0d1719;--card:#16282c;--ink:#d6dfd9;--dim:#8da29d;--accent:#2f7f96}
  @media (prefers-color-scheme:light){:root{--bg:#f4f6f5;--card:#fff;--ink:#14211f;--dim:#5b6d69;--accent:#1f7891}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:420px;padding:32px;border-radius:16px;background:var(--card)}
  h1{margin:0 0 8px;font-size:26px}p{margin:0 0 20px;color:var(--dim)}
  a{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Something went wrong</h1>
  <p>The lab app hit an error on its side. Nothing you did caused it. Try again in a moment; if it keeps happening, tell your lab admin.</p>
  <a href="/">Back to the dashboard</a>
</main>
</body>
</html>
