{% load static %}<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1719" id="themeColor">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChemLab">
<meta name="description" content="Chemical inventory, a 3D reactor, the periodic table and bench calculators for your lab.">
<link rel="manifest" href="{% url 'manifest' %}">
<link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
<meta name="csrf-token" content="{{ csrf_token }}">
<link rel="preload" href="{% static 'fonts/IBMPlexSans-Regular.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{% static 'fonts/IBMPlexSans-SemiBold.woff2' %}" as="font" type="font/woff2" crossorigin>
<script>/* apply saved preferences before the first paint: theme, effects level, sidebar width */
(function () {
  var d = document.documentElement, get = function (k, v) { try { return localStorage.getItem("schemlab." + k) || v; } catch (e) { return v; } };
  var pref = get("theme", "system"), light = pref === "light" || (pref === "system" && matchMedia("(prefers-color-scheme: light)").matches);
  d.dataset.theme = light ? "light" : "dark"; d.dataset.themePref = pref;
  d.dataset.fx = matchMedia("(prefers-reduced-motion: reduce)").matches ? "minimal" : get("fx", "standard");
  if (get("sidebar", "") === "collapsed") d.classList.add("sb-collapsed");
  try { if (matchMedia("(display-mode: standalone)").matches && !sessionStorage.getItem("schemlab.splash")) { d.classList.add("show-splash"); sessionStorage.setItem("schemlab.splash", "1"); } } catch (e) {}
  try { var vt = sessionStorage.getItem("schemlab.vt"); if (vt) d.style.setProperty("--vt-at", vt); } catch (e) {}
  var m = document.getElementById("themeColor"); if (m) m.content = light ? "#f4f6f5" : "#0d1719";
  /* when the next page declines the page-change animation (after some form posts), Chrome rejects an internal
     promise on the page being left. That is expected, so keep it out of the console; every other error still shows. */
  addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    if (r && r.name === "InvalidStateError" && /^Transition was aborted/.test(r.message)) e.preventDefault();
  });
})();</script>
<link rel="stylesheet" href="{% static 'css/lab.css' %}">
